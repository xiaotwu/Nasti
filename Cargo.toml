[workspace]
resolver = "2"
members = [
    "crates/uraniborg-core",
    "crates/convallis-pipe",
    "hosts/load-bearing-crew/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Nasti Acoustic Engineering Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.7", features = ["http2", "macros"] }
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "query", "system-proxy"] }
