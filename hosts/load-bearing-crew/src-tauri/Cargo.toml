[package]
name = "load-bearing-crew"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uraniborg-core = { path = "../../../crates/uraniborg-core" }
convallis-pipe = { path = "../../../crates/convallis-pipe" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
reqwest = { workspace = true, features = ["form", "json"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
plist = "1"
rustix = { version = "1", features = ["fs"] }
security-framework = "3"
semver = "1"
tar = "0.4"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
